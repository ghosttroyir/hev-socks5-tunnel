name: build-libhev

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          ln -sf . jni

      - name: Build android-so (official ndk-build)
        run: |
          ./android-ndk-r27d/ndk-build APP_MODULES=hev-socks5-tunnel -j$(nproc)
          find libs -name "*.so" | head -10
          ls -lh libs/arm64-v8a/

      - name: Locate and prepare library
        run: |
          # المكتبة الرسمية: libs/arm64-v8a/libhev-socks5-tunnel.so
          SRC=$(find libs -name "*.so" -path "*arm64*" | head -1)
          echo "Source: $SRC"
          ls -lh "$SRC"
          # تحقق من الرموز المصدَّرة
          ./android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D "$SRC" | grep -E "hev_socks5_tunnel_main_from_file|hev_socks5_tunnel_quit|Java_" || echo "NO JNI SYMBOLS"
          # ننسخها باسم libhev.so (الاسم الذي يحمّله تطبيقنا)
          mkdir -p out
          cp "$SRC" out/libhev.so
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhev-android
          path: out/libhev.so
